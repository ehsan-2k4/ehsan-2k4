<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070f"/><stop offset="100%" stop-color="#06161d"/>
    </linearGradient>
    <pattern id="sgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#22d3ee" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="sglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="250" fill="url(#sbg)"/>
  <rect width="1000" height="250" fill="url(#sgrid)"/>

  <g font-family="'Fira Code',ui-monospace,monospace">
    <text x="40" y="44" font-size="17" font-weight="700" fill="#a855f7">STACK</text>
    <text x="120" y="44" font-size="13" fill="#8b8fa3">what I reach for, in order</text>

    <!-- row 1 -->
    <text x="40" y="86" font-size="12" fill="#22d3ee" letter-spacing="2">CORE</text>
    <g>
      <rect x="130" y="70" width="118" height="30" rx="15" fill="#150a2e" stroke="#a855f7" stroke-opacity="0.7"/>
      <text x="189" y="90" font-size="12.5" fill="#e9d5ff" text-anchor="middle">Python</text>
      <rect x="258" y="70" width="118" height="30" rx="15" fill="#150a2e" stroke="#a855f7" stroke-opacity="0.7"/>
      <text x="317" y="90" font-size="12.5" fill="#e9d5ff" text-anchor="middle">FastAPI</text>
      <rect x="386" y="70" width="86" height="30" rx="15" fill="#150a2e" stroke="#a855f7" stroke-opacity="0.7"/>
      <text x="429" y="90" font-size="12.5" fill="#e9d5ff" text-anchor="middle">OOP</text>
      <rect x="482" y="70" width="86" height="30" rx="15" fill="#150a2e" stroke="#a855f7" stroke-opacity="0.7"/>
      <text x="525" y="90" font-size="12.5" fill="#e9d5ff" text-anchor="middle">Git</text>
      <rect x="578" y="70" width="100" height="30" rx="15" fill="#150a2e" stroke="#a855f7" stroke-opacity="0.7"/>
      <text x="628" y="90" font-size="12.5" fill="#e9d5ff" text-anchor="middle">Linux</text>
    </g>

    <!-- row 2 -->
    <text x="40" y="140" font-size="12" fill="#22d3ee" letter-spacing="2">AGENTIC</text>
    <g>
      <rect x="130" y="124" width="196" height="30" rx="15" fill="#0b3c4a" stroke="#22d3ee" stroke-opacity="0.8" filter="url(#sglow)"/>
      <text x="228" y="144" font-size="12.5" fill="#e0f7fc" text-anchor="middle">OpenAI Agents SDK</text>
      <rect x="336" y="124" width="86" height="30" rx="15" fill="#0b3c4a" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="379" y="144" font-size="12.5" fill="#e0f7fc" text-anchor="middle">n8n</text>
      <rect x="432" y="124" width="132" height="30" rx="15" fill="#0b3c4a" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="498" y="144" font-size="12.5" fill="#e0f7fc" text-anchor="middle">Claude Code</text>
      <rect x="574" y="124" width="118" height="30" rx="15" fill="#0b3c4a" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="633" y="144" font-size="12.5" fill="#e0f7fc" text-anchor="middle">Opencode</text>
      <rect x="702" y="124" width="86" height="30" rx="15" fill="#0b3c4a" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="745" y="144" font-size="12.5" fill="#e0f7fc" text-anchor="middle">MCP</text>
    </g>

    <!-- row 3 -->
    <text x="40" y="194" font-size="12" fill="#22d3ee" letter-spacing="2">WEB</text>
    <g>
      <rect x="130" y="178" width="100" height="30" rx="15" fill="#0f0f1a" stroke="#6b7280" stroke-opacity="0.6"/>
      <text x="180" y="198" font-size="12.5" fill="#c9d1d9" text-anchor="middle">HTML5</text>
      <rect x="240" y="178" width="100" height="30" rx="15" fill="#0f0f1a" stroke="#6b7280" stroke-opacity="0.6"/>
      <text x="290" y="198" font-size="12.5" fill="#c9d1d9" text-anchor="middle">CSS3</text>
      <rect x="350" y="178" width="128" height="30" rx="15" fill="#0f0f1a" stroke="#6b7280" stroke-opacity="0.6"/>
      <text x="414" y="198" font-size="12.5" fill="#c9d1d9" text-anchor="middle">JavaScript</text>
      <text x="496" y="198" font-size="11.5" fill="#6b7280">15+ pixel-accurate clones · trained the eye</text>
    </g>

    <text x="40" y="232" font-size="11.5" fill="#8b8fa3" font-style="italic">
      specs are the contract — code is just the implementation detail
    </text>
  </g>
  <line x1="0" y1="248" x2="1000" y2="248" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
</svg>
