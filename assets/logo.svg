<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">SPEC OS logo</title>
  <desc id="logoDesc">A neon purple hexagonal spec chip containing a terminal caret and underscore.</desc>

  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="50%"  stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="logo-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="70%"  stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes logoBreathe { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      @keyframes logoBlink   { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      @keyframes logoSpin    { to { stroke-dashoffset:-640 } }
      .logo-halo  { animation: logoBreathe 3.5s ease-in-out infinite; }
      .logo-caret { animation: logoBlink 1s steps(1) infinite; }
      .logo-orbit { animation: logoSpin 12s linear infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <rect width="256" height="256" rx="56" fill="#0D1117"/>
  <circle class="logo-halo" cx="128" cy="128" r="112" fill="url(#logo-halo)"/>

  <!-- outer hex -->
  <path d="M128 24 L218 76 L218 180 L128 232 L38 180 L38 76 Z"
        fill="#161B22" stroke="url(#logo-grad)" stroke-width="6"
        stroke-linejoin="round" filter="url(#logo-glow)"/>

  <!-- orbiting dashed hex -->
  <path class="logo-orbit"
        d="M128 44 L200 86 L200 170 L128 212 L56 170 L56 86 Z"
        fill="none" stroke="#C084FC" stroke-width="1.75"
        stroke-opacity="0.45" stroke-dasharray="10 14" stroke-linejoin="round"/>

  <!-- caret -->
  <path d="M96 100 L124 128 L96 156" fill="none" stroke="#F8FAFC"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- underscore -->
  <rect class="logo-caret" x="136" y="146" width="34" height="10" rx="5" fill="#C084FC"/>
</svg>
