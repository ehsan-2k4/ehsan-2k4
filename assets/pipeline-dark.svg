<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Spec-Driven Development pipeline">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070f"/><stop offset="100%" stop-color="#0d0820"/>
    </linearGradient>
    <linearGradient id="pacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="pgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="pglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1000" height="300" fill="url(#pbg)"/>
  <rect width="1000" height="300" fill="url(#pgrid)"/>

  <text x="40" y="46" font-family="'Fira Code',ui-monospace,monospace" font-size="17" font-weight="700" fill="#22d3ee">
    THE LOOP
  </text>
  <text x="150" y="46" font-family="'Fira Code',ui-monospace,monospace" font-size="13" fill="#8b8fa3">
    no code until spec, plan and tasks agree
  </text>

  <!-- stages -->
  <g font-family="'Fira Code',ui-monospace,monospace">
    <!-- 1 constitution -->
    <rect x="40" y="90" width="140" height="70" rx="10" fill="#150a2e" stroke="#a855f7" stroke-width="1.6"/>
    <text x="110" y="118" font-size="13" fill="#d8b4fe" text-anchor="middle">📜</text>
    <text x="110" y="140" font-size="12.5" fill="#e9d5ff" text-anchor="middle">constitution</text>

    <line x1="180" y1="125" x2="216" y2="125" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 2 specify -->
    <rect x="224" y="90" width="140" height="70" rx="10" fill="#2a1259" stroke="#a855f7" stroke-width="2"/>
    <text x="294" y="118" font-size="13" fill="#d8b4fe" text-anchor="middle">📋</text>
    <text x="294" y="140" font-size="12.5" fill="#fff" text-anchor="middle">/specify</text>

    <line x1="364" y1="125" x2="400" y2="125" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 3 clarify -->
    <rect x="408" y="90" width="140" height="70" rx="10" fill="#150a2e" stroke="#a855f7" stroke-width="1.6"/>
    <text x="478" y="118" font-size="13" fill="#d8b4fe" text-anchor="middle">❓</text>
    <text x="478" y="140" font-size="12.5" fill="#e9d5ff" text-anchor="middle">/clarify</text>

    <line x1="548" y1="125" x2="584" y2="125" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 4 plan -->
    <rect x="592" y="90" width="140" height="70" rx="10" fill="#3b1d7a" stroke="#a855f7" stroke-width="2"/>
    <text x="662" y="118" font-size="13" fill="#d8b4fe" text-anchor="middle">🧭</text>
    <text x="662" y="140" font-size="12.5" fill="#fff" text-anchor="middle">/plan</text>

    <line x1="732" y1="125" x2="768" y2="125" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 5 tasks -->
    <rect x="776" y="90" width="140" height="70" rx="10" fill="#0b3c4a" stroke="#22d3ee" stroke-width="2"/>
    <text x="846" y="118" font-size="13" fill="#a5f3fc" text-anchor="middle">✅</text>
    <text x="846" y="140" font-size="12.5" fill="#fff" text-anchor="middle">/tasks</text>

    <!-- down + second row -->
    <path d="M846 160 L846 190 L662 190 L662 206" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 6 analyze -->
    <rect x="592" y="214" width="140" height="60" rx="10" fill="#0b3c4a" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="662" y="240" font-size="13" fill="#a5f3fc" text-anchor="middle">🔍</text>
    <text x="662" y="260" font-size="12.5" fill="#e0f7fc" text-anchor="middle">/analyze</text>

    <line x1="592" y1="244" x2="556" y2="244" stroke="#22d3ee" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 7 implement -->
    <rect x="380" y="214" width="168" height="60" rx="10" fill="#22d3ee" stroke="#67e8f9" stroke-width="2" filter="url(#pglow)"/>
    <text x="464" y="240" font-size="13" fill="#062a33" text-anchor="middle">⚡</text>
    <text x="464" y="260" font-size="13" font-weight="700" fill="#07131a" text-anchor="middle">/implement</text>

    <!-- feedback -->
    <path d="M380 244 L294 244 L294 160" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)">
      <animate attributeName="stroke-dashoffset" values="22;0" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <text x="300" y="205" font-size="11" fill="#c084fc">learnings</text>
  </g>

  <!-- travelling pulse -->
  <circle r="4.5" fill="#22d3ee" filter="url(#pglow)">
    <animateMotion dur="7s" repeatCount="indefinite"
      path="M110,125 L294,125 L478,125 L662,125 L846,125 L846,190 L662,190 L662,244 L464,244 L294,244 L294,125"/>
  </circle>
</svg>
