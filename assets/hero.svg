<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Muhammad Ehsan — Full Stack Developer — SPEC OS v1.0</title>
  <desc id="heroDesc">Neon purple hero banner with an animated typing tagline, blueprint grid, floating particles and a glowing avatar ring.</desc>

  <defs>
    <linearGradient id="hero-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/><stop offset="50%" stop-color="#A855F7"/><stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="hero-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hero-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#7C3AED" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="hero-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hero-avatar-clip"><circle cx="985" cy="200" r="88"/></clipPath>

    <style>
      .f-display { font-family:"Space Grotesk", Inter, "Segoe UI", system-ui, sans-serif; }
      .f-mono    { font-family:"JetBrains Mono","Fira Code",Consolas,monospace; }

      @keyframes heroDrift  { to { transform: translate(40px, 40px) } }
      @keyframes heroPulse  { 0%,100% { opacity:.55; r:5 } 50% { opacity:1; r:6.5 } }
      @keyframes heroBlink  { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      @keyframes heroFloat  { 0%,100% { transform:translateY(0); opacity:.22 } 50% { transform:translateY(-12px); opacity:.6 } }
      @keyframes heroRing   { to { stroke-dashoffset:-560 } }
      @keyframes heroScan   { 0% { transform:translateY(-40px) } 100% { transform:translateY(440px) } }

      /* 12s loop, 3 phrases */
      @keyframes t1 { 0%{opacity:0} 2%{opacity:1} 28%{opacity:1} 31%{opacity:0} 100%{opacity:0} }
      @keyframes t2 { 0%,33%{opacity:0} 35%{opacity:1} 61%{opacity:1} 64%{opacity:0} 100%{opacity:0} }
      @keyframes t3 { 0%,66%{opacity:0} 68%{opacity:1} 94%{opacity:1} 97%{opacity:0} 100%{opacity:0} }
      @keyframes w1 { 0%{width:0} 20%{width:430px} 100%{width:430px} }

      .grid    { animation: heroDrift 18s linear infinite; }
      .dot     { animation: heroPulse 2s ease-in-out infinite; }
      .caret   { animation: heroBlink 1s steps(1) infinite; }
      .ring    { animation: heroRing 14s linear infinite; }
      .scan    { animation: heroScan 6s linear infinite; }
      .p       { animation: heroFloat 7s ease-in-out infinite; }
      .p:nth-of-type(2n) { animation-duration: 9s;  animation-delay:-2s }
      .p:nth-of-type(3n) { animation-duration:11s;  animation-delay:-4s }
      .tag1 { animation: t1 12s linear infinite; }
      .tag2 { animation: t2 12s linear infinite; }
      .tag3 { animation: t3 12s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important }
        .tag2,.tag3 { opacity:0 } .tag1 { opacity:1 }
      }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="400" rx="20" fill="#0D1117"/>
  <g clip-path="inset(0 round 20)">
    <rect class="grid" x="-40" y="-40" width="1280" height="480" fill="url(#hero-grid)"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#A855F7" opacity="0.06"/>
    <circle cx="985" cy="200" r="190" fill="url(#hero-halo)"/>

    <!-- particles -->
    <g fill="#C084FC">
      <circle class="p" cx="120" cy="330" r="2.5"/><circle class="p" cx="300" cy="88"  r="2"/>
      <circle class="p" cx="470" cy="340" r="2.5"/><circle class="p" cx="640" cy="70"  r="2"/>
      <circle class="p" cx="760" cy="300" r="3"/>  <circle class="p" cx="880" cy="96"  r="2"/>
      <circle class="p" cx="1120" cy="300" r="2.5"/><circle class="p" cx="1060" cy="70" r="2"/>
    </g>

    <!-- ── left column ── -->
    <text class="f-mono" x="72" y="86" fill="#8B949E" font-size="12" letter-spacing="3.2">SPEC OS v1.0</text>

    <text class="f-display" x="72" y="146" fill="#F8FAFC" font-size="48" font-weight="700" letter-spacing="-0.5">MUHAMMAD EHSAN</text>
    <text class="f-mono"    x="72" y="180" fill="#C084FC" font-size="16" letter-spacing="4">FULL STACK DEVELOPER</text>

    <rect x="72" y="204" width="620" height="1.5" fill="url(#hero-rule)"/>

    <!-- status -->
    <circle class="dot" cx="80" cy="238" r="5.5" fill="#22C55E" filter="url(#hero-glow)"/>
    <text class="f-mono" x="98" y="243" fill="#22C55E" font-size="12" letter-spacing="2.6">SYSTEM ONLINE</text>

    <!-- typing taglines -->
    <g class="f-mono" font-size="17" fill="#F8FAFC">
      <text class="tag1" x="72" y="288">Engineering software with specifications first.</text>
      <text class="tag2" x="72" y="288">Where every feature begins with a specification.</text>
      <text class="tag3" x="72" y="288">Predictable systems. Intentional architecture.</text>
    </g>
    <rect class="caret" x="72" y="274" width="9" height="18" fill="#C084FC" opacity="0.9">
      <animate attributeName="x" values="72;560;72" dur="12s" repeatCount="indefinite"/>
    </rect>

    <!-- tech chips -->
    <g class="f-mono" font-size="11" letter-spacing="1.4">
      <g><rect x="72"  y="322" width="104" height="28" rx="6" fill="#161B22" stroke="#30363D"/><text x="124" y="340" fill="#C084FC" text-anchor="middle">TYPESCRIPT</text></g>
      <g><rect x="188" y="322" width="86"  height="28" rx="6" fill="#161B22" stroke="#30363D"/><text x="231" y="340" fill="#C084FC" text-anchor="middle">NEXT.JS</text></g>
      <g><rect x="286" y="322" width="86"  height="28" rx="6" fill="#161B22" stroke="#30363D"/><text x="329" y="340" fill="#C084FC" text-anchor="middle">NODE.JS</text></g>
      <g><rect x="384" y="322" width="80"  height="28" rx="6" fill="#161B22" stroke="#30363D"/><text x="424" y="340" fill="#C084FC" text-anchor="middle">PYTHON</text></g>
      <g><rect x="476" y="322" width="98"  height="28" rx="6" fill="#161B22" stroke="#30363D"/><text x="525" y="340" fill="#8B949E" text-anchor="middle">PAKISTAN</text></g>
    </g>

    <!-- ── right: avatar ── -->
    <circle cx="985" cy="200" r="96" fill="#161B22" stroke="#30363D"/>
    <g clip-path="url(#hero-avatar-clip)">
      <rect x="897" y="112" width="176" height="176" fill="#1C2128"/>
      <text class="f-display" x="985" y="228" fill="#A855F7" font-size="76" font-weight="700" text-anchor="middle" opacity="0.85">ME</text>
    </g>
    <circle cx="985" cy="200" r="96" fill="none" stroke="url(#hero-brand)" stroke-width="4" filter="url(#hero-glow)"/>
    <circle class="ring" cx="985" cy="200" r="112" fill="none" stroke="#C084FC" stroke-width="1.5"
            stroke-opacity="0.5" stroke-dasharray="14 18"/>
    <g class="f-mono" font-size="11" letter-spacing="2.4" text-anchor="middle">
      <text x="985" y="332" fill="#8B949E">@ehsah-2k4</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="20" fill="none" stroke="#30363D"/>
</svg>
