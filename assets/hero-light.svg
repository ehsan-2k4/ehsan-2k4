<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Muhammad Ehsan - Spec-Driven Development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f2ff"/>
      <stop offset="55%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f0fbff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7c3aed" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeclip"><rect x="60" y="96" width="0" height="46">
      <animate attributeName="width" values="0;0;620;620" keyTimes="0;0.06;0.6;1" dur="6s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>
  <circle cx="880" cy="60" r="150" fill="#22d3ee" opacity="0.10" filter="url(#glow)"/>
  <circle cx="120" cy="230" r="130" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>

  <text x="60" y="62" font-family="'Fira Code',ui-monospace,monospace" font-size="15" fill="#22d3ee" letter-spacing="4">
    ~/ SPEC &#8594; PLAN &#8594; TASKS &#8594; IMPLEMENT
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.4s" repeatCount="indefinite"/>
  </text>

  <g clip-path="url(#typeclip)">
    <text x="60" y="132" font-family="'Fira Code',ui-monospace,monospace" font-weight="700" font-size="42" fill="url(#accent)">MUHAMMAD EHSAN</text>
  </g>
  <rect x="60" y="98" width="3" height="42" fill="#22d3ee">
    <animate attributeName="x" values="60;60;686;686" keyTimes="0;0.06;0.6;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="172" font-family="'Fira Code',ui-monospace,monospace" font-size="17" fill="#2b2b3a">
    Spec-Driven Development · Agentic AI Engineering · Backend
  </text>
  <text x="60" y="204" font-family="'Fira Code',ui-monospace,monospace" font-size="14" fill="#5b5b70" font-style="italic">
    &#8220;I don&#8217;t vibe-code. I ship specs.&#8221;
  </text>

  <g font-family="'Fira Code',ui-monospace,monospace" font-size="12">
    <rect x="60" y="218" width="112" height="26" rx="13" fill="none" stroke="#a855f7" stroke-opacity="0.6"/>
    <text x="116" y="235" fill="#6d28d9" text-anchor="middle">Python</text>
    <rect x="182" y="218" width="112" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="238" y="235" fill="#0e7490" text-anchor="middle">FastAPI</text>
    <rect x="304" y="218" width="150" height="26" rx="13" fill="none" stroke="#a855f7" stroke-opacity="0.6"/>
    <text x="379" y="235" fill="#6d28d9" text-anchor="middle">OpenAI Agents</text>
    <rect x="464" y="218" width="90" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="509" y="235" fill="#0e7490" text-anchor="middle">n8n</text>
  </g>

  <g opacity="0.9">
    <line x1="0" y1="257" x2="1000" y2="257" stroke="url(#accent)" stroke-width="3"/>
  </g>
  <circle r="4" fill="#22d3ee" filter="url(#glow)">
    <animateMotion path="M0,257 L1000,257" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
